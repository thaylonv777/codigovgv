<style>
:root{
  --ink:#06080D; --ink2:#0A0E16; --ink3:#10151F; --panel:#0D121B;
  --paper:#F3F1EA; --white:#fff;
  --gold:#C9A14E; --gold-l:#F0D9A0; --gold-d:#8A6726;
  --muted:#8E95A3; --muted2:#C6CAD4; --line:rgba(240,217,160,.16);
  --ok:#4CAF7D; --bad:#E0776B;
  --grad-gold:linear-gradient(135deg,#F7E7BC 0%,#E0C27E 28%,#C9A14E 55%,#9C7634 100%);
  --maxw:560px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--ink);color:var(--paper);
  line-height:1.55;overflow-x:hidden;-webkit-font-smoothing:antialiased;min-height:100vh}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px;position:relative}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;line-height:1.1;font-weight:900;letter-spacing:-.01em}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
.gold{background:var(--grad-gold);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
body{
  background:
    radial-gradient(900px 620px at 84% -12%,rgba(201,161,78,.16),transparent 62%),
    radial-gradient(760px 700px at -8% 112%,rgba(201,161,78,.09),transparent 62%),
    linear-gradient(165deg,#06080D 0%,#0A0E16 48%,#10151F 100%);
}

/* progress */
#progwrap{position:fixed;top:0;left:0;right:0;height:3px;background:rgba(255,255,255,.06);z-index:60}
#prog{height:100%;width:0%;background:var(--grad-gold);box-shadow:0 0 14px rgba(201,161,78,.6);transition:width .4s cubic-bezier(.19,1,.22,1)}

main{padding:40px 0 60px;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.stepwrap{display:flex;flex-direction:column;gap:22px}
.eyebrow{font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;font-weight:700;color:var(--gold-l);display:flex;align-items:center;gap:8px}
.eyebrow .n{color:var(--muted)}

.q-title{font-size:clamp(22px,5.5vw,30px);color:#fff}
.q-sub{color:var(--muted2);font-size:15px;margin-top:6px}

.opts{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;width:100%;border:1px solid var(--line);
  background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.012));
  color:var(--paper);border-radius:14px;padding:17px 18px;font-size:15.5px;font-weight:600;cursor:pointer;
  transition:transform .2s,border-color .2s,background .2s;font-family:inherit}
.opt:hover{border-color:rgba(240,217,160,.5);background:rgba(240,217,160,.06);transform:translateY(-2px)}
.opt .ic{flex:none;width:30px;height:30px;border-radius:9px;background:rgba(201,161,78,.14);color:var(--gold-l);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;box-shadow:inset 0 0 0 1px rgba(240,217,160,.25)}

.hero-intro{text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px}
.seal{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:800;
  color:#120D04;background:var(--grad-gold);padding:9px 16px;border-radius:40px;box-shadow:0 8px 24px -8px rgba(201,161,78,.6)}
.hero-intro h1{font-size:clamp(26px,6.5vw,36px);color:#fff}
.hero-intro p{color:var(--muted2);font-size:16px;max-width:420px}

.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;font-weight:700;font-size:17px;
  padding:18px 30px;border-radius:12px;cursor:pointer;border:none;text-align:center;overflow:hidden;width:100%;font-family:inherit;
  transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.btn-gold{background:var(--grad-gold);color:#140E03;box-shadow:0 12px 34px -10px rgba(201,161,78,.65),inset 0 1px 0 rgba(255,255,255,.55)}
.btn-gold::after{content:'';position:absolute;top:0;left:-70%;width:45%;height:100%;transform:skewX(-20deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:sheen 4.5s ease-in-out infinite}
@keyframes sheen{0%,62%{left:-70%}85%,100%{left:130%}}
.btn-gold:hover{transform:translateY(-3px)}
.btn[disabled]{opacity:.55;pointer-events:none}

.back{color:var(--muted);font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;cursor:pointer;align-self:flex-start;background:none;border:none;font-family:inherit;padding:6px 0}
.back:hover{color:var(--gold-l)}

/* loading step */
.loading{text-align:center;display:flex;flex-direction:column;align-items:center;gap:20px;padding:30px 0}
.spinner{width:46px;height:46px;border-radius:50%;border:3px solid rgba(240,217,160,.18);border-top-color:var(--gold-l);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{color:var(--muted2);font-size:15px}
.loading .line{font-family:'Playfair Display',serif;font-style:italic;color:#fff;font-size:18px}

/* ===== RESULT / MINI LANDING ===== */
.result{display:none}
.result.show{display:block}
.r-top{text-align:center;margin-bottom:28px}
.r-top .seal{margin-bottom:14px}
.r-top h1{font-size:clamp(24px,6vw,32px);color:#fff}
.r-diag{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.012));border:1px solid var(--line);
  border-radius:16px;padding:18px 20px;margin:18px 0 26px}
.r-diag .tag{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--gold-l);margin-bottom:6px}
.r-diag p{color:var(--muted2);font-size:14.5px}
.r-diag b{color:#fff}

.video-wrap{margin-bottom:22px}
.video-frame{position:relative;aspect-ratio:9/16;max-height:420px;max-width:260px;margin:0 auto;border-radius:18px;overflow:hidden;background:#000;
  border:1px solid rgba(240,217,160,.28);box-shadow:0 30px 60px -22px rgba(0,0,0,.9),0 0 40px -14px rgba(201,161,78,.35)}
.video-frame iframe{width:100%;height:100%;border:0;display:block}
.video-quote{font-family:'Playfair Display',serif;font-style:italic;font-size:15.5px;color:#fff;text-align:center;
  max-width:420px;margin:16px auto 0;padding:0 10px}
.video-name{color:var(--muted);font-size:12px;text-align:center;margin-top:8px}

.reaffirm{text-align:center;margin:0 0 24px;padding:20px 18px;border-radius:16px;
  background:radial-gradient(120% 140% at 50% 0%,rgba(201,161,78,.12),transparent 70%);border:1px solid var(--line)}
.reaffirm p{font-family:'Playfair Display',serif;font-style:italic;font-size:16.5px;color:#fff;line-height:1.4}

.proofbar{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:26px}
.stat{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center}
.stat .v{font-family:'Playfair Display',serif;font-weight:900;font-size:20px;background:var(--grad-gold);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.stat .l{font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:4px;font-weight:600;line-height:1.3}

.r-list{list-style:none;display:flex;flex-direction:column;gap:11px;margin:0 0 26px}
.r-list li{display:flex;gap:11px;align-items:flex-start;color:#E7E9EE;font-size:14.5px}
.r-list li .c{flex:none;color:var(--gold-l);font-weight:800}

.price-card{position:relative;border-radius:22px;padding:30px 24px 26px;text-align:center;
  background:linear-gradient(180deg,#141A25,#080B12);box-shadow:0 30px 70px -24px rgba(0,0,0,.9),0 0 50px -18px rgba(201,161,78,.45);
  margin-bottom:18px}
.price-card::before{content:'';position:absolute;inset:0;border-radius:22px;padding:1px;background:var(--grad-gold);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.price-card .tag{position:absolute;top:-13px;left:50%;transform:translateX(-50%);white-space:nowrap}
.price-old{font-size:16px;color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(224,119,107,.8);margin-top:14px}
.price-now{font-family:'Playfair Display',serif;font-weight:900;font-size:clamp(46px,12vw,58px);color:#fff;line-height:1;margin:4px 0;letter-spacing:-.02em}
.price-now .cur{font-size:.4em;color:var(--gold-l);vertical-align:super;font-weight:700;margin-right:3px}
.price-sub{color:var(--muted);font-size:12.5px;margin-bottom:20px}
.price-note{margin-top:14px;font-size:11.5px;color:var(--muted);line-height:1.5}

.assure{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-bottom:10px}
.assure span{display:inline-flex;align-items:center;gap:5px}
.check{color:var(--gold-l)}

footer.disc{color:#6B6F7A;font-size:11px;text-align:center;padding:30px 0 10px;line-height:1.6}
</style>
</head>

<script>
var CHECKOUT_URL = "https://pay.kiwify.com.br/2a2yZPt";
var STEP_WEBHOOK_URL = "https://n8n.manuai.com.br/webhook/funil-vgv-step";
var answers = {};
var idx = 0;
var TOTAL_INTERACTIVE = 4; // 2 perguntas + 2 etapas de método (pra barra de progresso)

function sessionId(){
  try{
    var k="vgv_sid", v=sessionStorage.getItem(k);
    if(!v){ v=Date.now().toString(36)+Math.random().toString(36).slice(2,10); sessionStorage.setItem(k,v); }
    return v;
  }catch(e){ return "nosess-"+Date.now(); }
}
function trackStep(s){
  try{
    fetch(STEP_WEBHOOK_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({session_id:sessionId(),step_index:idx,step_total:steps.length,step_label:(s.title||s.type),step_type:s.type,origem:"quiz-vgv",respostas_ate_aqui:JSON.stringify(answers)})
    }).catch(function(){});
  }catch(e){}
}

var steps = [

    },

    }

  },
  {
    type: "statement",
    eyebrow: "O custo de esperar",
    title: "Cada dia sem o código certo é dinheiro saindo do seu bolso.",
    body: "Enquanto você ajusta orçamento no escuro, alguém com a estrutura certa está fechando venda com a mesma verba que você está desperdiçando agora. O método já está pronto. Falta só você aplicar.",

  },
  { type: "loading" },
  { type: "result" }
];

var DIAG = {

    tag: "Você está rasgando dinheiro por falta de estrutura",
    text: "Sem a <b>estrutura validada</b> (1 campanha × 4 conjuntos × 3-4 criativos), sua verba se espalha e some. O Código VGV é o passo a passo completo de como subir essa campanha certa — tela a tela, do zero até o publicar.",

    text: "O problema não é o anúncio, é a <b>campanha atraindo o público errado</b>. O Código VGV é o passo a passo de como montar a campanha validada pra atrair quem já está pronto pra comprar — não curioso.",
    highlight: "O passo a passo de como subir a campanha validada que atrai comprador, não curioso."
  },
  gasto: {

    highlight: "O passo a passo validado de como estruturar a campanha sem desperdiçar verba."
  }
};

function sanitize(s){ return String(s||"").replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]}) }

function render(){
  var s = steps[idx];
  var app = document.getElementById("app");
  var progPct = Math.min(100, Math.round((idx/TOTAL_INTERACTIVE)*100));
  document.getElementById("prog").style.width = progPct + "%";
  trackStep(s);

  if(s.type === "intro"){
    app.innerHTML = s.render();
    s.bind();
    return;
  }

  if(s.type === "question"){
    var html = '<div class="stepwrap">';
    if(idx>1) html += '<button class="back" id="btnBack">← voltar</button>';
    html += '<div class="eyebrow"><span class="n">Etapa '+idx+' de '+TOTAL_INTERACTIVE+'</span></div>'+
      '<div><h2 class="q-title">'+s.title+'</h2><p class="q-sub">'+s.sub+'</p></div>'+
      '<div class="opts">';
    s.options.forEach(function(o,i){
      html += '<button class="opt" data-v="'+o.v+'"><span class="ic">'+String.fromCharCode(65+i)+'</span><span>'+o.label+'</span></button>';
    });
    html += '</div></div>';
    app.innerHTML = html;
    if(idx>1) document.getElementById("btnBack").onclick = function(){ goTo(idx-1); };
    app.querySelectorAll(".opt").forEach(function(btn){
      btn.onclick = function(){
        answers[s.key] = btn.getAttribute("data-v");
        goTo(idx+1);
      };
    });
    return;
  }

  if(s.type === "statement"){
    var html = '<div class="stepwrap">';
    html += '<button class="back" id="btnBack">← voltar</button>';
    html += '<div class="eyebrow"><span class="n">Etapa '+idx+' de '+TOTAL_INTERACTIVE+'</span></div>'+
      '<div><p class="q-sub" style="margin-bottom:8px">'+s.eyebrow+'</p><h2 class="q-title">'+s.title+'</h2><p class="q-sub" style="margin-top:12px">'+s.body+'</p></div>'+

      '</div>';

    document.getElementById("btnBack").onclick = function(){ goTo(idx-1); };
    document.getElementById("btnNext").onclick = function(){ goTo(idx+1); };
    return;
  }

  if(s.type === "loading"){
    app.innerHTML = '<div class="loading"><div class="spinner"></div>'+
      '<p class="line">Cruzando suas respostas com o método validado...</p>'+

    return;

  if(s.type === "result"){
    var diag = DIAG[answers.gargalo] || DIAG.estrutura;
    app.innerHTML =
      '<div class="result show">'+
        '<div class="r-top">'+
          '<span class="seal">✦ Seu diagnóstico está pronto</span>'+
          '<h1>'+diag.tag+'</h1>'+
        '</div>'+
        '<div class="r-diag"><p>'+diag.text+'</p></div>'+
        '<div class="video-wrap"><div class="video-frame"><iframe src="https://www.youtube.com/embed/2ewkU2yamJ4?rel=0&modestbranding=1" title="Depoimento — resultado real com o método" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>'+
          '<p class="video-quote">"Foi a estrutura de campanha certa, para o comprador certo, na hora certa de comprar."</p>'+
          '<p class="video-name">Case real de campanha gerida pela Método Átrio.</p>'+
        '</div>'+
        '<div class="proofbar">'+
          '<div class="stat"><div class="v">9</div><div class="l">Imóveis vendidos em 30 dias</div></div>'+
          '<div class="stat"><div class="v">R$2M+</div><div class="l">Em vendas geradas</div></div>'+
          '<div class="stat"><div class="v">12,41x</div><div class="l">ROAS na campanha</div></div>'+
        '</div>'+
        '<div class="reaffirm"><p>Vou te pegar pela mão com essa metodologia — e você vai subir campanhas que vendem.</p></div>'+
        '<ul class="r-list">'+
          '<li><span class="c">✓</span> <b style="color:#fff">A campanha validada, tela a tela</b> — do botão Criar ao publicar</li>'+
          '<li><span class="c">✓</span> '+diag.highlight+'</li>'+
          '<li><span class="c">✓</span> Segmentação, modelos de copy e roteiro de atendimento (complementos prontos)</li>'+
          '<li><span class="c">✓</span> Acesso imediato e vitalício, direto no seu e-mail</li>'+
        '</ul>'+
