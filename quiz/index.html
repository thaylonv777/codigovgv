<style>
:root{
  --ink:#06080D; --ink2:#0A0E16; --ink3:#10151F; --panel:#0D121B;
  --paper:#F3F1EA; --white:#fff;
  --gold:#C9A14E; --gold-l:#F0D9A0; --gold-d:#8A6726;
  --muted:#8E95A3; --muted2:#C6CAD4; --line:rgba(240,217,160,.16);
  --ok:#4CAF7D; --bad:#E0776B;
  --grad-gold:linear-gradient(135deg,#F7E7BC 0%,#E0C27E 28%,#C9A14E 55%,#9C7634 100%);
  --maxw:560px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--ink);color:var(--paper);
  line-height:1.55;overflow-x:hidden;-webkit-font-smoothing:antialiased;min-height:100vh}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px;position:relative}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;line-height:1.1;font-weight:900;letter-spacing:-.01em}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
.gold{background:var(--grad-gold);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
body{
  background:
    radial-gradient(900px 620px at 84% -12%,rgba(201,161,78,.16),transparent 62%),
    radial-gradient(760px 700px at -8% 112%,rgba(201,161,78,.09),transparent 62%),
    linear-gradient(165deg,#06080D 0%,#0A0E16 48%,#10151F 100%);
}

/* progress */
.progress{display:flex;flex-direction:column;gap:8px}
.progress-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:12px;font-weight:700;letter-spacing:.04em}
.progress-top .st{color:var(--gold-l);text-transform:uppercase;letter-spacing:.14em;font-size:11.5px}
.progress-top .hint{color:var(--muted);font-weight:600}
.progress-track{height:8px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(240,217,160,.10)}
.progress-fill{height:100%;border-radius:99px;background:var(--grad-gold);box-shadow:0 0 16px rgba(201,161,78,.55);
  transition:width .7s cubic-bezier(.19,1,.22,1)}

main{padding:28px 0 60px;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.stepwrap{display:flex;flex-direction:column;gap:22px}
.eyebrow{font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;font-weight:700;color:var(--gold-l);display:flex;align-items:center;gap:8px}
.eyebrow .n{color:var(--muted)}

.q-title{font-size:clamp(22px,5.5vw,30px);color:#fff}
.q-sub{color:var(--muted2);font-size:15px;margin-top:6px}

.opts{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;width:100%;border:1px solid var(--line);
  background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.012));
  color:var(--paper);border-radius:14px;padding:17px 18px;font-size:15.5px;font-weight:600;cursor:pointer;
  transition:transform .2s,border-color .2s,background .2s;font-family:inherit}
@media (hover:hover){.opt:hover{border-color:rgba(240,217,160,.5);background:rgba(240,217,160,.06);transform:translateY(-2px)}}
.opt:active{border-color:rgba(240,217,160,.6);background:rgba(240,217,160,.08)}
.opt .ic{flex:none;width:30px;height:30px;border-radius:9px;background:rgba(201,161,78,.14);color:var(--gold-l);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;box-shadow:inset 0 0 0 1px rgba(240,217,160,.25)}

.hero-intro{text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px}
.hero-q h1{font-size:clamp(27px,7vw,36px);color:#fff}
.hero-q .lead{color:var(--muted2);font-size:15.5px;margin-top:10px}
.hero-q .lead b{color:#fff}
.q-kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--gold-l);margin-bottom:6px}
.hero-q .q-title{font-size:clamp(19px,4.8vw,22px)}
.hero-q .opt{color:#fff;border-color:rgba(110,214,160,.45);
  background:linear-gradient(135deg,#1E7A54 0%,#0E5238 100%);
  box-shadow:0 10px 26px -12px rgba(30,122,84,.85),inset 0 1px 0 rgba(255,255,255,.14)}
.hero-q .opt .ic{background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.32)}
@media (hover:hover){.hero-q .opt:hover{background:linear-gradient(135deg,#23905F 0%,#126444 100%);border-color:rgba(150,235,190,.75)}}
.hero-q .opt:active{background:linear-gradient(135deg,#23905F 0%,#126444 100%);border-color:rgba(150,235,190,.75)}
.author{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.author img{width:58px;height:58px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px var(--ink),0 0 0 3.5px var(--gold)}
.author b{display:block;font-size:14.5px;color:#fff;font-weight:700;line-height:1.25}
.author span{display:block;font-size:12px;color:var(--muted)}
.pq{position:relative;text-align:left;border:1px solid rgba(240,217,160,.28);border-radius:16px;padding:20px 16px 14px;margin-top:22px;
  background:linear-gradient(180deg,rgba(201,161,78,.12),rgba(201,161,78,.03))}
.pq-mark{position:absolute;top:-22px;left:12px;font-family:'Playfair Display',Georgia,serif;font-size:62px;line-height:1;color:var(--gold)}
.pq-text{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:400;font-size:16.5px;line-height:1.4;color:#fff}
.pq-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.pq-stats div{background:rgba(0,0,0,.28);border-radius:10px;padding:9px 4px;text-align:center;box-shadow:inset 0 0 0 1px rgba(240,217,160,.14)}
.pq-stats b{display:block;font-size:17px;font-weight:800;line-height:1.2;background:var(--grad-gold);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.pq-stats span{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.pq-who{font-size:11.5px;color:var(--muted);margin-top:10px}
.safe{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:2px}
.safe span{display:inline-flex;align-items:center;gap:5px}
.seal{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:800;
  color:#120D04;background:var(--grad-gold);padding:9px 16px;border-radius:40px;box-shadow:0 8px 24px -8px rgba(201,161,78,.6)}
.hero-intro h1{font-size:clamp(26px,6.5vw,36px);color:#fff}
.hero-intro p{color:var(--muted2);font-size:16px;max-width:420px}

.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;font-weight:700;font-size:17px;
  padding:18px 30px;border-radius:12px;cursor:pointer;border:none;text-align:center;overflow:hidden;width:100%;font-family:inherit;
  transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.btn-gold{background:var(--grad-gold);color:#140E03;box-shadow:0 12px 34px -10px rgba(201,161,78,.65),inset 0 1px 0 rgba(255,255,255,.55)}
.btn-gold::after{content:'';position:absolute;top:0;left:-70%;width:45%;height:100%;transform:skewX(-20deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:sheen 4.5s ease-in-out infinite}
@keyframes sheen{0%,62%{left:-70%}85%,100%{left:130%}}
.btn-gold:hover{transform:translateY(-3px)}
.btn[disabled]{opacity:.55;pointer-events:none}

.back{color:var(--muted);font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;cursor:pointer;align-self:flex-start;background:none;border:none;font-family:inherit;padding:6px 0}
.back:hover{color:var(--gold-l)}

.namefield{display:flex;flex-direction:column;gap:4px;margin-top:6px;padding-top:18px;border-top:1px solid var(--line)}
.name-q{font-size:clamp(21px,5.5vw,25px);color:#fff;margin-bottom:12px}
.namefield input{width:100%;padding:17px 18px;border-radius:12px;border:1px solid var(--line);
  background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.012));color:#fff;font-size:16px;
  font-family:inherit;font-weight:600}
.namefield input::placeholder{color:var(--muted);font-weight:500}
.namefield input:focus{outline:none;border-color:rgba(240,217,160,.55);box-shadow:0 0 0 3px rgba(201,161,78,.16)}
.field-err{color:var(--bad);font-size:12.5px;min-height:16px;margin:2px 2px 4px}
.namefield .btn{margin-top:4px}

/* loading step */
.loading{text-align:center;display:flex;flex-direction:column;align-items:center;gap:20px;padding:30px 0}
.spinner{width:46px;height:46px;border-radius:50%;border:3px solid rgba(240,217,160,.18);border-top-color:var(--gold-l);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{color:var(--muted2);font-size:15px}
.loading .line{font-family:'Playfair Display',serif;font-style:italic;color:#fff;font-size:18px}

/* ===== RESULT / MINI LANDING ===== */
.result{display:none}
.result.show{display:block}
.r-top{text-align:center;margin-bottom:28px}
.r-top .seal{margin-bottom:14px}
.r-top h1{font-size:clamp(24px,6vw,32px);color:#fff}
.r-diag{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.012));border:1px solid var(--line);
  border-radius:16px;padding:18px 20px;margin:18px 0 26px}
.r-diag .tag{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--gold-l);margin-bottom:6px}
.r-diag p{color:var(--muted2);font-size:14.5px}
.r-diag b{color:#fff}

.video-wrap{margin-bottom:22px}
.video-frame{position:relative;aspect-ratio:9/16;max-height:420px;max-width:260px;margin:0 auto;border-radius:18px;overflow:hidden;background:#000;
  border:1px solid rgba(240,217,160,.28);box-shadow:0 30px 60px -22px rgba(0,0,0,.9),0 0 40px -14px rgba(201,161,78,.35)}
.video-frame iframe{width:100%;height:100%;border:0;display:block}
.video-quote{font-family:'Playfair Display',serif;font-style:italic;font-size:15.5px;color:#fff;text-align:center;
  max-width:420px;margin:16px auto 0;padding:0 10px}
.video-name{color:var(--muted);font-size:12px;text-align:center;margin-top:8px}

.reaffirm{text-align:center;margin:0 0 24px;padding:20px 18px;border-radius:16px;
  background:radial-gradient(120% 140% at 50% 0%,rgba(201,161,78,.12),transparent 70%);border:1px solid var(--line)}
.reaffirm p{font-family:'Playfair Display',serif;font-style:italic;font-size:16.5px;color:#fff;line-height:1.4}

.proofbar{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:26px}
.stat{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center}
.stat .v{font-family:'Playfair Display',serif;font-weight:900;font-size:20px;background:var(--grad-gold);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.stat .l{font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:4px;font-weight:600;line-height:1.3}

.r-list{list-style:none;display:flex;flex-direction:column;gap:11px;margin:0 0 26px}
.r-list li{display:flex;gap:11px;align-items:flex-start;color:#E7E9EE;font-size:14.5px}
.r-list li .c{flex:none;color:var(--gold-l);font-weight:800}

.price-card{position:relative;border-radius:22px;padding:30px 24px 26px;text-align:center;
  background:linear-gradient(180deg,#141A25,#080B12);box-shadow:0 30px 70px -24px rgba(0,0,0,.9),0 0 50px -18px rgba(201,161,78,.45);
  margin-bottom:18px}
.price-card::before{content:'';position:absolute;inset:0;border-radius:22px;padding:1px;background:var(--grad-gold);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.price-card .tag{position:absolute;top:-13px;left:50%;transform:translateX(-50%);white-space:nowrap}
.price-old{font-size:16px;color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(224,119,107,.8);margin-top:14px}
.price-now{font-family:'Playfair Display',serif;font-weight:900;font-size:clamp(46px,12vw,58px);color:#fff;line-height:1;margin:4px 0;letter-spacing:-.02em}
.price-now .cur{font-size:.4em;color:var(--gold-l);vertical-align:super;font-weight:700;margin-right:3px}
.price-sub{color:var(--muted);font-size:12.5px;margin-bottom:20px}
.price-note{margin-top:14px;font-size:11.5px;color:var(--muted);line-height:1.5}

.assure{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-bottom:10px}
.assure span{display:inline-flex;align-items:center;gap:5px}
.check{color:var(--gold-l)}

footer.disc{color:#6B6F7A;font-size:11px;text-align:center;padding:30px 0 10px;line-height:1.6}
</style>

<footer class="disc wrap">Não há promessa de resultado. Os resultados variam conforme produto, praça, verba e execução. Este produto não é afiliado ao Meta/Facebook.</footer>

<script>
// /quiz         → preço fixo R$ 9,90 (vídeo com preço de 9,90)
// /quiz-19      → preço fixo R$ 19,00
// /diagnostico  → giro de preço (vídeo sem preço): cada visitante sorteia 19 / 47 / 67 e mantém nas próximas visitas
// Rotas no vercel.json. Forçar pra conferir: ?p=a (9,90) ?p=b (19) ?p=c (47) ?p=d (67)
// parcela: preencher {n:12, v:"4,90"} pra mostrar "12x R$ 4,90" em destaque e o à vista embaixo.
var PRICES = {
  a: { label: "9,90",  n: 9.9, url: "https://pay.kiwify.com.br/2a2yZPt", parcela: null },
  b: { label: "19,00", n: 19,  url: "https://pay.kiwify.com.br/i6FNiE2", parcela: null },
  c: { label: "47,00", n: 47,  url: "https://pay.kiwify.com.br/vGFvyHF", parcela: null },
  d: { label: "67,00", n: 67,  url: "https://pay.kiwify.com.br/EhrsmAD", parcela: null }
};
var GIRO = ["b", "c", "d"];
function priceVariant(){
  var forced = (location.search.match(/[?&]p=([abcd])\b/) || [])[1];
  if(forced) return forced;
  var path = location.pathname;
  if(/^\/quiz-19\/?$/.test(path)) return "b";
  if(/^\/diagnostico\/?$/.test(path)){
    var k = "vgv_giro_var", v = null;
    try{ v = localStorage.getItem(k); }catch(e){}
    if(GIRO.indexOf(v) < 0){
      v = GIRO[Math.floor(Math.random() * GIRO.length)];
      try{ localStorage.setItem(k, v); }catch(e){}
    }
    return v;
  }
  return "a";
}
var PRICE_KEY = priceVariant();
var PRICE = PRICES[PRICE_KEY];
var CHECKOUT_URL = PRICE.url;
var STEP_WEBHOOK_URL = "https://n8n.manuai.com.br/webhook/funil-vgv-step";
var answers = { preco: PRICE.label };

// Origem do tráfego (Meta x TikTok): utm_source, fbclid ou ttclid. Fica salvo na sessão.
var ORIGEM = (function(){
  var k = "vgv_origem", v = null;
  var qs = location.search || "";
  // ?teste=1 marca a sessão como teste e SOBREPÕE o que já estiver salvo na aba
  // (serve pra navegar no próprio funil sem sujar os números do painel).
  if(/[?&]teste=1\b/.test(qs)){
    try{ sessionStorage.setItem(k, "teste"); }catch(e){}
    return "teste";
  }
  try{ v = sessionStorage.getItem(k); }catch(e){}
  if(v) return v;
  var q = location.search || "";
  var m = q.match(/[?&]utm_source=([^&]*)/i);
  var s = "";
  try{ s = m ? decodeURIComponent(m[1]).toLowerCase() : ""; }catch(e){ s = m ? m[1].toLowerCase() : ""; }
  if(/tiktok/.test(s) || /[?&]ttclid=/i.test(q)) v = "tiktok";
  else if(/^(fb|facebook|ig|instagram|meta|an|msg)\b/.test(s) || /[?&]fbclid=/i.test(q)) v = "meta";
  else v = s || "direto";
  try{ sessionStorage.setItem(k, v); }catch(e){}
  return v;
})();
answers.origem = ORIGEM;

// Link da Kiwify com as UTMs da visita (pra venda mostrar a origem lá também)
function checkoutUrl(){
  try{
    var out = [], hasSource = false;
    (location.search || "").replace(/^\?/, "").split("&").forEach(function(pair){
      if(!pair) return;
      var key = pair.split("=")[0].toLowerCase();
      if(key.indexOf("utm_") === 0){ out.push(pair); if(key === "utm_source") hasSource = true; }
    });
    if(!hasSource) out.unshift("utm_source=" + encodeURIComponent(ORIGEM));
    out.push("src=" + encodeURIComponent(ORIGEM));
    return CHECKOUT_URL + (CHECKOUT_URL.indexOf("?") > -1 ? "&" : "?") + out.join("&");
  }catch(e){ return CHECKOUT_URL; }
}
var idx = 0;
var TOTAL_INTERACTIVE = 5; // nome + 3 perguntas + 1 etapa de método (pra barra de progresso)
// progresso já começa preenchido (efeito de progresso dado) e acelera no fim
var PROG = [10, 28, 46, 64, 82, 100];
var PROG_HINT = ["leva 30 segundos", "faltam 4", "faltam 3", "faltam 2", "última etapa", "gerando diagnóstico"];
function nome(){ return answers.nome ? answers.nome.trim().split(/\s+/)[0] : ""; }
var lastPct = 0;
function progressHTML(){
  var pct = PROG[Math.min(idx, PROG.length-1)];
  var stepTxt = idx < TOTAL_INTERACTIVE ? ("Etapa "+(idx+1)+" de "+TOTAL_INTERACTIVE) : "Concluído";
  return '<div class="progress">'+
    '<div class="progress-top"><span class="st">'+stepTxt+'</span><span class="hint">'+PROG_HINT[Math.min(idx, PROG_HINT.length-1)]+'</span></div>'+
    '<div class="progress-track"><div class="progress-fill" data-pct="'+pct+'" style="width:'+lastPct+'%"></div></div>'+
  '</div>';
}
function animateProgress(){
  var el = document.querySelector(".progress-fill");
  if(!el) return;
  var pct = +el.getAttribute("data-pct");
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ el.style.width = pct+"%"; }); });
  lastPct = pct;

function sessionId(){

// Ancoragem honesta do preço: compara com a verba que a própria pessoa declarou.
function precoAncora(){
  var v = answers.verba;
  if(PRICE_KEY === "a"){ // R$ 9,90 — textos originais, sem mudança
    if(v === "zero")  return "Pagamento único — menos que um dia de anúncio quando você começar.";
    if(v === "ate1k") return "Menos do que um único dia da sua verba atual.";
    if(v === "1a5k")  return "Menos do que um único dia da sua verba atual.";
    if(v === "5k+")   return "Menos de 15% de um único dia da sua verba.";
    return "";
  }
  // demais preços: conta feita pelo piso da faixa declarada, pra frase ser sempre verdadeira
  var p = PRICE.n;
  if(v === "zero") return "Pagamento único — antes de colocar o primeiro real em anúncio.";
  if(v === "1a5k"){
    var dias = p / (1000/30);
    return dias <= 1 ? "Menos do que um único dia da sua verba atual." : "Menos do que "+Math.ceil(dias)+" dias da sua verba atual.";
  }
  if(v === "5k+"){
    var pct = Math.ceil((p / (5000/30)) * 100 / 5) * 5;
    return "Menos de "+pct+"% de um único dia da sua verba.";
  }
  return ""; // até R$ 1.000: faixa larga demais pra comparar com honestidade
}
