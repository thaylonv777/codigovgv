<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard — Código VGV</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2306080D'/%3E%3Ccircle cx='32' cy='32' r='12' fill='%23C9A14E'/%3E%3C/svg%3E">
<link rel="manifest" href="/dashboard/manifest.json">
<link rel="apple-touch-icon" href="/dashboard/icon-192.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Código VGV">
<meta name="theme-color" content="#0A0A0B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#0A0A0B; --surface:#111113; --surface2:#17171a; --line:rgba(201,164,92,.18);
  --fg:#F3EEE4; --muted:rgba(243,238,228,.62);
  --gold:#C9A45C; --gold-l:#E6CE94; --gold-deep:#9C7A3C;
  --r:16px; --rs:11px; --maxw:860px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Inter",system-ui,-apple-system,sans-serif;
  padding:28px 16px 60px;-webkit-font-smoothing:antialiased}
.wrap{max-width:var(--maxw);margin:0 auto}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--gold)}
.brand b{font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;
  background:linear-gradient(110deg,#F3E2B3 0%,#C9A45C 55%,#9C7A3C 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:var(--muted);font-size:13px}
.refresh{background:var(--surface);border:1px solid var(--line);color:var(--gold-l);font-size:13px;font-weight:600;
  padding:9px 16px;border-radius:999px;cursor:pointer}
.refresh:hover{border-color:var(--gold)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:26px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--rs);padding:16px}
.card .n{font-size:26px;font-weight:800;color:var(--gold-l)}
.card .l{font-size:12px;color:var(--muted);margin-top:2px}
.section-title{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin:0 0 14px}
.funnel{display:flex;flex-direction:column;gap:10px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--rs);padding:14px 16px;position:relative;overflow:hidden}
.step .bar{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(201,164,92,.22),rgba(201,164,92,.06));z-index:0}
.step-content{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.step-left{display:flex;align-items:center;gap:12px;min-width:0}
.step-idx{font-weight:800;color:var(--gold);font-size:13px;flex:none;width:26px}
.step-label{font-size:13.5px;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:360px}
.step-right{display:flex;align-items:center;gap:16px;flex:none}
.step-n{font-weight:700;font-size:15px}
.step-pct{font-size:12px;color:var(--muted);min-width:46px;text-align:right}
.drop{font-size:11px;padding:2px 8px;border-radius:999px;background:rgba(239,68,68,.12);color:#f87171;font-weight:600}
.drop.ok{background:rgba(74,222,128,.12);color:#4ade80}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:40px 0}
.updated{color:var(--muted);font-size:11.5px;margin-top:18px;text-align:center}
.sessions{display:flex;flex-direction:column;gap:8px;margin-top:34px}
.sess{background:var(--surface);border:1px solid var(--line);border-radius:var(--rs);padding:12px 14px;cursor:pointer}
.sess-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sess-id{font-size:11px;color:var(--muted);font-family:monospace}
.sess-right{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex:1 1 auto;min-width:0}
.sess-step{font-size:12px;color:var(--gold-l);font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess-price,.sess-count,.sess-caret,.sess-id{flex:none}
.sess-count{font-size:11px;color:var(--muted)}
.sess-caret{color:var(--gold);font-size:11px;transition:.15s}
.sess.open .sess-caret{transform:rotate(90deg)}
.sess-answers{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:12.5px;color:var(--fg)}
.sess.open .sess-answers{display:block}
.ans-row{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px dashed var(--line)}
.ans-row:last-child{border-bottom:none}
.ans-q{color:var(--muted);flex:1}
.ans-a{color:var(--gold-l);font-weight:600;text-align:right;flex:none;max-width:50%}
.ans-empty{color:var(--muted);font-size:12px}
.ver{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.ver button{background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:12.5px;font-weight:600;
  padding:7px 14px;border-radius:999px;cursor:pointer;font-family:inherit}
.ver button.on{color:#140E03;background:var(--gold);border-color:var(--gold)}
.ver .note{font-size:11.5px;color:var(--muted)}
.ab{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:8px}
.ab-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--rs);padding:16px}
.ab-price{font-size:22px;font-weight:800;color:var(--gold-l)}
.ab-row{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px dashed var(--line)}
.ab-row:last-child{border-bottom:none}
.ab-row span:first-child{color:var(--muted)}
.ab-row b{color:var(--fg)}
.ab-note{font-size:11.5px;color:var(--muted);margin:0 0 26px}
.sess-price{font-size:11px;font-weight:700;color:#140E03;background:var(--gold);border-radius:999px;padding:2px 8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div>
      <div class="brand"><span class="dot"></span><b>Código VGV</b></div>
      <div class="sub">Funil do quiz — abandono por etapa</div>
    </div>
    <button class="refresh" id="btnRefresh">↻ Atualizar</button>
  </div>

  <div class="ver">
    <button id="vNew" class="on">Versão nova</button>
    <button id="vOld">Versão anterior</button>
    <span class="note" id="vNote"></span>
  </div>

  <div class="cards" id="cards"></div>

  <div id="abWrap" style="display:none">
    <div class="section-title">Teste de preço</div>
    <div class="ab" id="ab"></div>
    <p class="ab-note">Visitantes divididos 50/50 no quiz. Vendas confirmadas: conferir no Kiwify por link de checkout.</p>
  </div>

  <div class="section-title">Etapas do funil</div>
  <div class="funnel" id="funnel"><div class="empty">Carregando...</div></div>

  <div class="section-title" style="margin-top:34px">Sessões recentes</div>
  <div class="sessions" id="sessions"></div>

  <div class="updated" id="updated"></div>
</div>

<script>
var STATS_URL = "https://n8n.manuai.com.br/webhook/funil-vgv-stats";
// data em que o quiz passou a abrir direto na 1ª pergunta (sem tela de intro)
var V2_SINCE = "2026-10-28T12:30:00Z";
var version = "new";

function setVersion(v){
  version = v;
  document.getElementById("vNew").className = v==="new" ? "on" : "";
  document.getElementById("vOld").className = v==="old" ? "on" : "";
  var d = new Date(V2_SINCE).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
  document.getElementById("vNote").textContent = v==="new" ? ("desde "+d+" · abre direto na pergunta") : ("até "+d+" · com tela de intro");
  load();
}

function load(){
  document.getElementById("funnel").innerHTML = '<div class="empty">Carregando...</div>';
  var q = version==="new" ? ("?since="+encodeURIComponent(V2_SINCE)) : ("?until="+encodeURIComponent(V2_SINCE));
  fetch(STATS_URL+q).then(function(r){ return r.json(); }).then(render).catch(function(e){
    document.getElementById("funnel").innerHTML = '<div class="empty">Erro ao carregar dados: '+(e&&e.message||e)+'</div>';
  });
}

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

function render(data){
  var steps = data.steps||[];
  var cards = document.getElementById("cards");
  var totalStart = data.total_sessions||0;
  var lastStep = steps.length? steps[steps.length-1] : null;
  var convRate = (totalStart && lastStep) ? Math.round((lastStep.sessions/totalStart)*1000)/10 : 0;
  cards.innerHTML =
    '<div class="card"><div class="n">'+totalStart+'</div><div class="l">Sessões iniciadas</div></div>'+
    '<div class="card"><div class="n">'+(data.total_eventos||0)+'</div><div class="l">Eventos registrados</div></div>'+
    '<div class="card"><div class="n">'+convRate+'%</div><div class="l">Chegou até a última etapa</div></div>';

  var tp = data.teste_preco || [];
  document.getElementById("abWrap").style.display = tp.length ? "" : "none";
  document.getElementById("ab").innerHTML = tp.map(function(p){
    return '<div class="ab-card"><div class="ab-price">R$ '+esc(p.preco)+'</div>'+
      '<div class="ab-row"><span>Sessões</span><b>'+p.sessoes+'</b></div>'+
      '<div class="ab-row"><span>Viram o preço (resultado)</span><b>'+p.resultado+'</b></div>'+
      '<div class="ab-row"><span>Clicaram comprar</span><b>'+p.checkout+'</b></div>'+
      '<div class="ab-row"><span>Clique ÷ viu o preço</span><b>'+p.pct_checkout_resultado+'%</b></div>'+
      '<div class="ab-row"><span>Clique ÷ sessões</span><b>'+p.pct_checkout_sessoes+'%</b></div>'+
    '</div>';
  }).join("");

  var f = document.getElementById("funnel");
  if(!steps.length){
    f.innerHTML = '<div class="empty">Sem dados nesse período ainda.</div>';
    document.getElementById("sessions").innerHTML = "";
    return;
  }
  var html = "";
  steps.forEach(function(s,i){
    var dropClass = s.pct_vs_prev>=70 ? "ok" : "";
    html += '<div class="step"><div class="bar" style="width:'+s.pct_of_start+'%"></div>'+
      '<div class="step-content">'+
        '<div class="step-left"><span class="step-idx">'+(i+1)+'</span><span class="step-label">'+esc(s.step_label)+'</span></div>'+
        '<div class="step-right">'+
          (i>0?'<span class="drop '+dropClass+'">'+s.pct_vs_prev+'% vs anterior</span>':'')+
          '<span class="step-pct">'+s.pct_of_start+'%</span>'+
          '<span class="step-n">'+s.sessions+'</span>'+
        '</div>'+
      '</div></div>';
  });
  f.innerHTML = html;

  var sess = document.getElementById("sessions");
  var list = data.sessions||[];
  if(!list.length){
    sess.innerHTML = '<div class="empty">Nenhuma sessão registrada ainda.</div>';
  }else{
    sess.innerHTML = list.map(function(s,i){
      var qas = Object.keys(s.respostas||{}).filter(function(k){ return k !== "preco"; });
      var preco = (s.respostas||{}).preco;
      var answersHtml = qas.length
        ? qas.map(function(q){ return '<div class="ans-row"><span class="ans-q">'+esc(q)+'</span><span class="ans-a">'+esc(s.respostas[q])+'</span></div>'; }).join("")
        : '<div class="ans-empty">Nenhuma pergunta respondida ainda (abandonou antes).</div>';
      var when = s.updated_at ? new Date(s.updated_at).toLocaleString("pt-BR") : "";
      return '<div class="sess" data-i="'+i+'">'+
        '<div class="sess-head">'+
          '<span class="sess-id">'+esc(s.session_id)+'</span>'+
          '<div class="sess-right">'+
            (preco ? '<span class="sess-price">R$ '+esc(preco)+'</span>' : '')+
            '<span class="sess-step">'+esc(s.step_label)+'</span>'+
            '<span class="sess-count">'+qas.length+' resp.</span>'+
            '<span class="sess-caret">▸</span>'+
          '</div>'+
        '</div>'+
        '<div class="sess-answers">'+answersHtml+(when?'<div class="ans-row"><span class="ans-q">Última atividade</span><span class="ans-a">'+esc(when)+'</span></div>':'')+'</div>'+
      '</div>';
    }).join("");
    sess.querySelectorAll(".sess").forEach(function(el){
      el.onclick = function(){ el.classList.toggle("open"); };
    });
  }

  document.getElementById("updated").textContent = "Atualizado em " + new Date(data.generated_at||Date.now()).toLocaleString("pt-BR");
}

document.getElementById("btnRefresh").onclick = load;
document.getElementById("vNew").onclick = function(){ setVersion("new"); };
document.getElementById("vOld").onclick = function(){ setVersion("old"); };
setVersion("new");
</script>
</body>
</html>
